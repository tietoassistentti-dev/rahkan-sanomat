<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rahkan Sanomat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #020b14;
  --bg-glow: #071d31;
  --panel: rgba(8, 17, 28, 0.92);
  --panel-hover: rgba(13, 26, 42, 0.98);
  --border: rgba(56, 189, 248, 0.26);
  --text: #f3f4f6;
  --dim: #a9d5f5;
  --accent: #38bdf8;
  --accent-glow: rgba(56, 189, 248, 0.32);
  --badge-bg: rgba(12, 24, 39, 0.9);
}
* { box-sizing:border-box; margin:0; padding:0; }
body {
  background:
    radial-gradient(circle at top, rgba(56, 189, 248, 0.12), transparent 26%),
    radial-gradient(circle at bottom, rgba(14, 116, 144, 0.1), transparent 28%),
    linear-gradient(180deg, #01080f 0%, #010d18 38%, #01080f 100%);
  color:var(--text);
  font-family:'Inter', sans-serif;
  line-height:1.6;
  padding-bottom: 60px;
}
.wrap { max-width:900px; margin:0 auto; padding:24px 16px; }

header { 
  position: static;
  top: auto;
  left: auto;
  transform: none;
  z-index: auto;
  width: 100%;
  border:1px solid rgba(56, 189, 248, 0.32);
  border-radius: 14px;
  padding: 18px 16px 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
  background: linear-gradient(180deg, rgba(2, 9, 17, 0.99), rgba(4, 12, 20, 0.99));
  box-shadow: 0 0 0 rgba(56, 189, 248, 0), 0 0 22px rgba(56, 189, 248, 0.12), 0 0 32px rgba(56, 189, 248, 0.06), inset 0 0 18px rgba(56, 189, 248, 0.04);
  backdrop-filter: blur(8px);
  transition: box-shadow 0.25s ease, border-color 0.25s ease, padding 0.25s ease;
}
.header-top {
  display: flex;
  justify-content: center;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
  width: 100%;
  text-align: center;
  transition: opacity 0.2s ease, transform 0.2s ease;
}
h1 {
  font-size: 26px;
  font-weight: 500;
  letter-spacing: -0.05em;
  text-align: center;
  line-height: 1.15;
  color: #e5f3ff;
  text-shadow: 0 0 16px rgba(56, 189, 248, 0.18);
}
h1 span {
  color: var(--accent);
  text-shadow: 0 0 18px rgba(56, 189, 248, 0.35);
}

.controls {
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
  justify-content: center;
}

.view-toggle {
  display: inline-flex;
  gap: 6px;
  background: rgba(8, 17, 28, 0.7);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 4px;
}

.view-toggle button {
  background: transparent;
  color: var(--text);
  border: none;
  padding: 6px 10px;
  border-radius: 6px;
  font-size: 12px;
}

.view-toggle button.active {
  background: rgba(56, 189, 248, 0.18);
  color: var(--accent);
  box-shadow: inset 0 0 0 1px rgba(56, 189, 248, 0.25);
}

button {
  font-family: 'Inter', sans-serif;
  cursor: pointer;
  font-weight: 500;
  transition: all 0.2s ease;
}

.lang-btn {
  background: linear-gradient(180deg, rgba(12, 22, 35, 0.96), rgba(7, 15, 26, 0.96));
  color: var(--text);
  border: 1px solid var(--border);
  padding: 6px 12px;
  border-radius: 6px;
  font-size: 13px;
  box-shadow: inset 0 0 0 rgba(56, 189, 248, 0), 0 0 0 rgba(56, 189, 248, 0);
  transition: all 0.25s ease;
}
.lang-btn.active {
  background: linear-gradient(180deg, var(--accent), #7dd3fc);
  color: #000;
  border-color: var(--accent);
  box-shadow: 0 0 20px rgba(56, 189, 248, 0.45), inset 0 0 12px rgba(255,255,255,0.32);
  font-weight: 600;
}
.lang-btn:hover:not(.active) {
  background: linear-gradient(180deg, rgba(17, 31, 49, 0.98), rgba(9, 19, 31, 0.98));
  border-color: rgba(56, 189, 248, 0.6);
  box-shadow: 0 0 16px rgba(56, 189, 248, 0.18), inset 0 0 10px rgba(56, 189, 248, 0.08);
}

.logout-btn {
  background: transparent;
  color: #f87171;
  border: 1px solid rgba(248, 113, 113, 0.2);
  padding: 6px 12px;
  border-radius: 6px;
  font-size: 13px;
  box-shadow: 0 0 0 rgba(248, 113, 113, 0);
  transition: all 0.25s ease;
}
.logout-btn:hover {
  background: rgba(248, 113, 113, 0.1);
  box-shadow: 0 0 12px rgba(248, 113, 113, 0.12);
}

.search-bar {
  width: 100%;
  padding: 10px 14px;
  background: linear-gradient(180deg, rgba(12, 24, 39, 0.96), rgba(8, 17, 28, 0.96));
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  font-size: 14px;
  font-family: 'Inter', sans-serif;
  outline: none;
  transition: border-color 0.25s ease, box-shadow 0.25s ease, transform 0.25s ease;
  box-shadow: inset 0 0 10px rgba(56, 189, 248, 0.04);
}
.search-bar:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.12), 0 0 18px rgba(56, 189, 248, 0.18), inset 0 0 12px rgba(56, 189, 248, 0.05);
}

#stories {
  display: flex;
  flex-direction: column;
  gap: 14px;
  filter: saturate(1) brightness(1);
  opacity: 1;
  transition: filter 0.2s ease, opacity 0.2s ease;
}

.story { 
  background: linear-gradient(180deg, rgba(10, 21, 35, 0.96), rgba(5, 13, 22, 0.96));
  border: 1px solid rgba(56, 189, 248, 0.26);
  border-radius: 10px; 
  padding: 16px; 
  transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
  box-shadow: inset 0 0 10px rgba(56, 189, 248, 0.04), 0 0 0 rgba(56, 189, 248, 0);
}
.story:hover {
  transform: translateY(-2px);
  border-color: rgba(56, 189, 248, 0.6);
  box-shadow: 0 10px 30px -12px rgba(56, 189, 248, 0.24), 0 0 22px rgba(56, 189, 248, 0.12), inset 0 0 14px rgba(56, 189, 248, 0.08);
}
.story h2 { font-size: 16px; font-weight: 600; margin-bottom: 6px; line-height: 1.4; }
.story h2 a { color: var(--text); text-decoration: none; transition: color 0.15s; }
.story h2 a:hover { color: var(--accent); }

.meta { 
  display: flex;
  gap: 10px;
  align-items: center;
  color: var(--dim); 
  font-size: 11px; 
  font-family: 'JetBrains Mono', monospace;
  flex-wrap: wrap;
}
.source-badge {
  background: var(--badge-bg);
  padding: 2px 6px;
  border-radius: 4px;
  color: var(--accent);
  font-weight: 500;
}

.visitor-box { background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:16px; margin-top:24px; display:none; }
.visitor-box h3 { font-size:14px; margin-bottom:10px; color:var(--accent); font-weight: 600; }
.visitor-list { font-size:11px; color:var(--dim); list-style-type:none; font-family: 'JetBrains Mono', monospace; }
.visitor-list li { padding:4px 0; border-bottom:1px dashed var(--border); }

footer { border-top:1px solid var(--border); margin-top:32px; padding-top:16px; color:var(--dim); font-size:12px; text-align: center; }

.sub { color: var(--dim); text-align: center; padding: 30px 0; font-size: 14px; }
</style>
</head>
<body>
<script>
if (!localStorage.getItem('rs_auth')) {
  window.location.href = './login.html';
}
</script>
<div class="wrap">
<header>
  <div class="header-top">
    <h1>Rahkan <span>Sanomat</span></h1>
    <div class="controls">
      <div>
        <button id="btn-en" class="lang-btn" onclick="setLang('en')">EN</button>
        <button id="btn-fi" class="lang-btn" onclick="setLang('fi')">FI</button>
      </div>
      <div class="view-toggle" aria-label="Article view mode">
        <button id="view-translate" class="active" onclick="setLinkMode('translate')">Translate</button>
        <button id="view-original" onclick="setLinkMode('original')">Original</button>
      </div>
      <button class="logout-btn" onclick="logout()">Sign Out</button>
    </div>
  </div>
  <input type="text" id="search-input" class="search-bar" placeholder="Hae uutisista / Search stories..." oninput="render()">
</header>

<div id="stories"><p class="sub">Ladataan uutisia… / Loading stories...</p></div>

<div class="visitor-box">
  <h3>Visitor Sign-in Log (Admin Only)</h3>
  <ul id="visitor-list" class="visitor-list"><li>No visits recorded yet.</li></ul>
</div>

<footer>
  Rahkan Sanomat &middot; Multi-perspective European news aggregator
</footer>
</div>

<script>
let STORIES_EN = [];
let STORIES_FI = [];

function logout() {
  localStorage.removeItem('rs_auth');
  localStorage.removeItem('rs_admin');
  window.location.href = './login.html';
}

const urlParams = new URLSearchParams(window.location.search);
const forcedLang = urlParams.get('lang');
const validLangs = ['en', 'fi'];

if (forcedLang && validLangs.includes(forcedLang)) {
  localStorage.setItem('rs_lang', forcedLang);
}

let currentLang = (forcedLang && validLangs.includes(forcedLang)) ? forcedLang : (localStorage.getItem('rs_lang') || 'fi');
let linkMode = localStorage.getItem('rs_link_mode') || 'translate';

function setLang(l) {
  currentLang = l;
  localStorage.setItem('rs_lang', l);
  document.getElementById('btn-en').classList.toggle('active', l === 'en');
  document.getElementById('btn-fi').classList.toggle('active', l === 'fi');
  render();
}

function setLinkMode(mode) {
  linkMode = mode;
  localStorage.setItem('rs_link_mode', mode);
  document.getElementById('view-translate').classList.toggle('active', mode === 'translate');
  document.getElementById('view-original').classList.toggle('active', mode === 'original');
  render();
}

function render() {
  // Sync button states on render
  document.getElementById('btn-en').classList.toggle('active', currentLang === 'en');
  document.getElementById('btn-fi').classList.toggle('active', currentLang === 'fi');
  document.getElementById('view-translate').classList.toggle('active', linkMode === 'translate');
  document.getElementById('view-original').classList.toggle('active', linkMode === 'original');

  let stories = currentLang === 'fi' ? STORIES_FI : STORIES_EN;
  const query = document.getElementById('search-input').value.toLowerCase().trim();
  
  if (query) {
    stories = stories.filter(s => {
      const headline = (currentLang === 'fi' && s.headline_fi ? s.headline_fi : s.headline).toLowerCase();
      const source = (s.source || '').toLowerCase();
      return headline.includes(query) || source.includes(query);
    });
  }

  const box = document.getElementById('stories');
  if (!stories.length) { 
    box.innerHTML = `<p class="sub">${currentLang === 'fi' ? 'Ei uutisia saatavilla.' : 'No stories found.'}</p>`; 
    return; 
  }

  box.innerHTML = stories.map(s => {
    const headline = currentLang === 'fi' && s.headline_fi ? s.headline_fi : s.headline;
    const link = (() => {
      const rawLink = s.link || '#';
      if (linkMode === 'original') {
        return rawLink;
      }
      const targetLang = currentLang === 'fi' ? 'fi' : 'en';
      try {
        const translateUrl = new URL('https://translate.google.com/translate');
        translateUrl.searchParams.set('sl', 'auto');
        translateUrl.searchParams.set('tl', targetLang);
        translateUrl.searchParams.set('u', rawLink);
        return translateUrl.toString();
      } catch (e) {
        return rawLink;
      }
    })();
    const source = s.source || 'Source';
    const pub = s.pub || 'Recent';
    return `
      <div class="story">
        <h2><a href="${link}" target="_blank" rel="noopener">${headline}</a></h2>
        <div class="meta">
          <span class="source-badge">${source}</span>
          <span>&bull;</span>
          <span>${pub}</span>
        </div>
      </div>`;
  }).join('');

  const vBox = document.querySelector('.visitor-box');
  if (localStorage.getItem('rs_admin')) {
    vBox.style.display = 'block';
    const visitors = JSON.parse(localStorage.getItem('rs_visitors') || '[]');
    const vList = document.getElementById('visitor-list');
    vList.innerHTML = visitors.length > 0 ? visitors.map(v => `<li>🗓️ ${v.time} &nbsp;|&nbsp; 🖥️ ${v.ua}</li>`).join('') : '<li>No visits recorded yet.</li>';
  }
}

async function loadStories() {
  try {
    const [resEn, resFi] = await Promise.all([
      fetch('./data/stories.json?t=' + Date.now()),
      fetch('./data/stories_fi.json?t=' + Date.now())
    ]);
    if (resEn.ok) {
      STORIES_EN = await resEn.json();
      console.log("Loaded EN stories:", STORIES_EN.length);
    }
    if (resFi.ok) {
      STORIES_FI = await resFi.json();
      console.log("Loaded FI stories:", STORIES_FI.length);
    }
  } catch (e) {
    console.error("Failed to fetch stories data:", e);
  }
  render();
}

loadStories();
</script>
</body>
</html>
