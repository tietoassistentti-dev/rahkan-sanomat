<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rahkan Sanomat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #090d16;
  --panel: #111827;
  --panel-hover: #1f2937;
  --border: #1e293b;
  --text: #f3f4f6;
  --dim: #9ca3af;
  --accent: #38bdf8;
  --accent-glow: rgba(56, 189, 248, 0.15);
  --badge-bg: #1e293b;
}
* { box-sizing:border-box; margin:0; padding:0; }
body { background:var(--bg); color:var(--text); font-family:'Inter', sans-serif; line-height:1.6; padding-bottom: 60px; }
.wrap { max-width:900px; margin:0 auto; padding:24px 16px; }

header { 
  border-bottom:1px solid var(--border); 
  padding-bottom:20px; 
  margin-bottom:24px; 
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
}
.header-top {
  display: flex;
  justify-content: center;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
  width: 100%;
  text-align: center;
}
h1 { font-size:24px; font-weight:700; letter-spacing:-0.5px; text-align:center; }
h1 span { color:var(--accent); }

.controls {
  display: flex;
  gap: 8px;
  align-items: center;
}

button {
  font-family: 'Inter', sans-serif;
  cursor: pointer;
  font-weight: 500;
  transition: all 0.2s ease;
}

.lang-btn {
  background: var(--panel);
  color: var(--text);
  border: 1px solid var(--border);
  padding: 6px 12px;
  border-radius: 6px;
  font-size: 13px;
}
.lang-btn.active {
  background: var(--accent);
  color: #000;
  border-color: var(--accent);
  box-shadow: 0 0 15px var(--accent-glow);
  font-weight: 600;
}
.lang-btn:hover:not(.active) {
  background: var(--panel-hover);
  border-color: #475569;
}

.logout-btn {
  background: transparent;
  color: #f87171;
  border: 1px solid rgba(248, 113, 113, 0.2);
  padding: 6px 12px;
  border-radius: 6px;
  font-size: 13px;
}
.logout-btn:hover {
  background: rgba(248, 113, 113, 0.1);
}

.search-bar {
  width: 100%;
  padding: 10px 14px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  font-size: 14px;
  font-family: 'Inter', sans-serif;
  outline: none;
  transition: border-color 0.2s;
}
.search-bar:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-glow);
}

#stories {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.story { 
  background: var(--panel); 
  border: 1px solid var(--border); 
  border-radius: 10px; 
  padding: 16px; 
  transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
}
.story:hover {
  transform: translateY(-2px);
  border-color: #334155;
  box-shadow: 0 10px 30px -10px rgba(0,0,0,0.5);
}
.story h2 { font-size: 16px; font-weight: 600; margin-bottom: 6px; line-height: 1.4; }
.story h2 a { color: var(--text); text-decoration: none; transition: color 0.15s; }
.story h2 a:hover { color: var(--accent); }

.meta { 
  display: flex;
  gap: 10px;
  align-items: center;
  color: var(--dim); 
  font-size: 11px; 
  font-family: 'JetBrains Mono', monospace;
  flex-wrap: wrap;
}
.source-badge {
  background: var(--badge-bg);
  padding: 2px 6px;
  border-radius: 4px;
  color: var(--accent);
  font-weight: 500;
}

.visitor-box { background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:16px; margin-top:24px; display:none; }
.visitor-box h3 { font-size:14px; margin-bottom:10px; color:var(--accent); font-weight: 600; }
.visitor-list { font-size:11px; color:var(--dim); list-style-type:none; font-family: 'JetBrains Mono', monospace; }
.visitor-list li { padding:4px 0; border-bottom:1px dashed var(--border); }

footer { border-top:1px solid var(--border); margin-top:32px; padding-top:16px; color:var(--dim); font-size:12px; text-align: center; }

.sub { color: var(--dim); text-align: center; padding: 30px 0; font-size: 14px; }
</style>
</head>
<body>
<script>
if (!localStorage.getItem('rs_auth')) {
  window.location.href = './login.html';
}
</script>
<div class="wrap">
<header>
  <div class="header-top">
    <h1>Rahkan <span>Sanomat</span></h1>
    <div class="controls">
      <div>
        <button id="btn-en" class="lang-btn" onclick="setLang('en')">EN</button>
        <button id="btn-fi" class="lang-btn" onclick="setLang('fi')">FI</button>
      </div>
      <button class="logout-btn" onclick="logout()">Sign Out</button>
    </div>
  </div>
  <input type="text" id="search-input" class="search-bar" placeholder="Hae uutisista / Search stories..." oninput="render()">
</header>

<div id="stories"><p class="sub">Ladataan uutisia… / Loading stories...</p></div>

<div class="visitor-box">
  <h3>Visitor Sign-in Log (Admin Only)</h3>
  <ul id="visitor-list" class="visitor-list"><li>No visits recorded yet.</li></ul>
</div>

<footer>
  Rahkan Sanomat &middot; Multi-perspective European news aggregator
</footer>
</div>

<script>
let STORIES_EN = [];
let STORIES_FI = [];

function logout() {
  localStorage.removeItem('rs_auth');
  localStorage.removeItem('rs_admin');
  window.location.href = './login.html';
}

let currentLang = localStorage.getItem('rs_lang') || 'fi';

function setLang(l) {
  currentLang = l;
  localStorage.setItem('rs_lang', l);
  document.getElementById('btn-en').classList.toggle('active', l === 'en');
  document.getElementById('btn-fi').classList.toggle('active', l === 'fi');
  render();
}

function render() {
  // Sync button states on render
  document.getElementById('btn-en').classList.toggle('active', currentLang === 'en');
  document.getElementById('btn-fi').classList.toggle('active', currentLang === 'fi');

  let stories = currentLang === 'fi' ? STORIES_FI : STORIES_EN;
  const query = document.getElementById('search-input').value.toLowerCase().trim();
  
  if (query) {
    stories = stories.filter(s => {
      const headline = (currentLang === 'fi' && s.headline_fi ? s.headline_fi : s.headline).toLowerCase();
      const source = (s.source || '').toLowerCase();
      return headline.includes(query) || source.includes(query);
    });
  }

  const box = document.getElementById('stories');
  if (!stories.length) { 
    box.innerHTML = `<p class="sub">${currentLang === 'fi' ? 'Ei uutisia saatavilla.' : 'No stories found.'}</p>`; 
    return; 
  }

  box.innerHTML = stories.map(s => {
    const headline = currentLang === 'fi' && s.headline_fi ? s.headline_fi : s.headline;
    const link = s.link || '#';
    const source = s.source || 'Source';
    const pub = s.pub || 'Recent';
    return `
      <div class="story">
        <h2><a href="${link}" target="_blank" rel="noopener">${headline}</a></h2>
        <div class="meta">
          <span class="source-badge">${source}</span>
          <span>&bull;</span>
          <span>${pub}</span>
        </div>
      </div>`;
  }).join('');

  const vBox = document.querySelector('.visitor-box');
  if (localStorage.getItem('rs_admin')) {
    vBox.style.display = 'block';
    const visitors = JSON.parse(localStorage.getItem('rs_visitors') || '[]');
    const vList = document.getElementById('visitor-list');
    vList.innerHTML = visitors.length > 0 ? visitors.map(v => `<li>🗓️ ${v.time} &nbsp;|&nbsp; 🖥️ ${v.ua}</li>`).join('') : '<li>No visits recorded yet.</li>';
  }
}

async function loadStories() {
  try {
    const [resEn, resFi] = await Promise.all([
      fetch('./data/stories.json?t=' + Date.now()),
      fetch('./data/stories_fi.json?t=' + Date.now())
    ]);
    if (resEn.ok) {
      STORIES_EN = await resEn.json();
      console.log("Loaded EN stories:", STORIES_EN.length);
    }
    if (resFi.ok) {
      STORIES_FI = await resFi.json();
      console.log("Loaded FI stories:", STORIES_FI.length);
    }
  } catch (e) {
    console.error("Failed to fetch stories data:", e);
  }
  render();
}

loadStories();
</script>
</body>
</html>
