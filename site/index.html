<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WorldWire — Multi-Perspective Global News</title>
<meta name="description" content="The same world story, told from every side. Read global news through the lenses of different countries and outlets — translated, clustered, multi-perspective.">
<style>
:root { --bg:#0d1117; --panel:#161b22; --border:#30363d; --text:#e6edf3; --dim:#8b949e; --accent:#58a6ff; --green:#3fb950; --amber:#d29922; }
* { box-sizing:border-box; margin:0; padding:0; }
body { background:var(--bg); color:var(--text); font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; line-height:1.6; }
.wrap { max-width:860px; margin:0 auto; padding:32px 20px; }
header { border-bottom:1px solid var(--border); padding-bottom:20px; margin-bottom:24px; }
h1 { font-size:26px; }
h1 span { color:var(--accent); }
.sub { color:var(--dim); font-size:13px; margin-top:4px; }
.story { background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:18px; margin-bottom:16px; }
.story h2 { font-size:16px; margin-bottom:6px; }
.meta { color:var(--dim); font-size:12px; margin-bottom:10px; }
.persp { border-left:3px solid var(--accent); padding-left:12px; margin:8px 0; }
.persp .lang { color:var(--green); font-size:12px; font-weight:bold; }
.persp .dom { color:var(--dim); font-size:12px; }
.persp a { color:var(--text); text-decoration:none; }
.persp a:hover { color:var(--accent); }
footer { border-top:1px solid var(--border); margin-top:32px; padding-top:14px; color:var(--dim); font-size:12px; }
</style>
</head>
<body>
<script>
if (!localStorage.getItem('ww_auth')) {
  window.location.href = '/login.html';
}
</script>
<div class="wrap">
<header>
  <h1>World<span>Wire</span></h1>
  <div class="sub">The same story, told from every side. Multi-perspective European news — filtered for topics missing in local media.</div>
  
  <div style="margin-top:14px; display:flex; justify-content:space-between; align-items:center;">
    <div>
      <button id="btn-en" onclick="setLang('en')" style="background:var(--accent);color:#000;border:none;padding:6px 12px;border-radius:4px;cursor:pointer;font-weight:bold;margin-right:8px;">English</button>
      <button id="btn-fi" onclick="setLang('fi')" style="background:var(--panel);color:var(--text);border:1px solid var(--border);padding:6px 12px;border-radius:4px;cursor:pointer;font-weight:bold;">Suomi</button>
    </div>
    <button onclick="logout()" style="background:var(--panel);color:#f85149;border:1px solid var(--border);padding:6px 12px;border-radius:4px;cursor:pointer;font-size:12px;">Sign Out</button>
  </div>
</header>

<div id="stories"><p class="sub">Loading stories…</p></div>

<footer>
  WorldWire · sources: BBC, France24, DW, Le Monde, El Pais<br>
  Automated digests. Perspectives shown as published by each outlet; no editorial rewriting.
</footer>
</div>

<script>
function logout() {
  localStorage.removeItem('ww_auth');
  window.location.href = '/login.html';
}

let currentLang = 'en';
async function setLang(l) {
  currentLang = l;
  document.getElementById('btn-en').style.background = l === 'en' ? 'var(--accent)' : 'var(--panel)';
  document.getElementById('btn-en').style.color = l === 'en' ? '#000' : 'var(--text)';
  document.getElementById('btn-fi').style.background = l === 'fi' ? 'var(--accent)' : 'var(--panel)';
  document.getElementById('btn-fi').style.color = l === 'fi' ? '#000' : 'var(--text)';
  load();
}

async function load() {
  try {
    const endpoint = currentLang === 'fi' ? '/api/stories_fi' : '/api/stories';
    const auth = localStorage.getItem('ww_auth');
    const r = await fetch(endpoint, { headers: { 'Authorization': 'Basic ' + auth } });
    if (r.status === 401) {
      logout();
      return;
    }
    const stories = await r.json();
    const box = document.getElementById('stories');
    if (!stories.length) { box.innerHTML = '<p class="sub">No stories yet — pipeline still collecting.</p>'; return; }
    box.innerHTML = stories.map(s => {
      const headline = currentLang === 'fi' && s.headline_fi ? s.headline_fi : s.headline;
      const persp = (s.matches || []).map(m => {
        const dom = new URL(m.url).hostname.replace('www.','');
        const title = m.title || '(untitled)';
        return `<div class="persp"><span class="lang">${m.language || '?'} · ${dom}</span> — <a href="${m.url}" target="_blank" rel="noopener">${title}</a></div>`;
      }).join('');
      return `<div class="story"><h2>${headline}</h2><div class="meta">Published: ${s.pub || 'Unknown date'}</div>${persp}</div>`;
    }).join('');
  } catch(e) { document.getElementById('stories').innerHTML = '<p class="sub">Error loading: '+e+'</p>'; }
}
load();
</script>
</body>
</html>
