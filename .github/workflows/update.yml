name: Update WorldWire Feed

on:
  schedule:
    - cron: '0 * * * *' # Every hour
  workflow_dispatch: # Allow manual trigger

jobs:
  update-feed:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install translate

      - name: Run pipeline and translation
        run: |
          bash scripts/pipeline.sh
          python3 scripts/translate_fi.py
          python3 scripts/update_site.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/stories.json data/stories_fi.json data/rss_matches.jsonl site/index.html
          git commit -m "Auto-update news feed and site [skip ci]" || exit 0
          git push
